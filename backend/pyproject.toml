[project]
name = "lingo-backend"
version = "0.1.0"
description = "FastAPI backend for the Lingo language-learning app (Duolingo-style clone)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    # Declared now so the dependency set is fixed; first used in M1 (models).
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27,<1.0",   # required by FastAPI's TestClient
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Seed JSON files are data, not Python: ship them with the package.
[tool.setuptools.package-data]
"app.db.seed" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
